name: dukascopy-scale-test

# No form. Answers ONE question: can we read the OLD host's integer prices correctly for every instrument?
#  1) says first whether the NEW host (complete, preferred) is open right now
#  2) looks for an older dukascopy-node version that carries a scale ("decimalFactor") for every instrument
#  3) downloads one day (2025-03-04, Bid) for 15 different instruments from the old host, decodes it with that scale
#     and compares candle by candle with what the older library itself returns for the same day
#  4) uploads the scale table (dukascopy_scale.csv) and the comparison (dukascopy_scale_check.txt) to the release dukascopy-plan
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 1) Is the NEW host open? (latest library)
        continue-on-error: true
        run: |
          mkdir latest && cd latest && npm init -y >/dev/null && npm install dukascopy-node >/dev/null 2>&1
          cat > new.js <<'JSEOF'
          const { getHistoricalRates } = require('dukascopy-node');
          getHistoricalRates({ instrument: 'eurusd', dates: { from: '2025-03-04', to: '2025-03-05' }, timeframe: 'm1', priceType: 'bid', format: 'json', volumes: true, retryCount: 1, failAfterRetryCount: true })
            .then((d) => { console.log('NEW HOST: OPEN,', d.length, 'candles'); })
            .catch((e) => { console.log('NEW HOST: BLOCKED -', ((e && e.name) || '') + ' ' + String((e && e.message) || e).slice(0, 80)); });
          JSEOF
          node new.js 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 2) Find older library versions and their scale tables
        run: |
          cat > pick.js <<'JSEOF'
          const { execSync } = require('child_process');
          const t = JSON.parse(execSync('npm view dukascopy-node time --json').toString());
          const vs = Object.entries(t).filter(([k]) => /^\d+\.\d+\.\d+$/.test(k)).sort((a, b) => (a[1] < b[1] ? -1 : 1));
          console.log('versions on npm:', vs.length, '| first:', vs[0].join(' '), '| last:', vs[vs.length - 1].join(' '));
          const pick = new Set();
          for (const cut of ['2023-06-01', '2024-06-01', '2025-03-01']) { const c = vs.filter((x) => x[1] < cut); if (c.length) pick.add(c[c.length - 1][0]); }
          require('fs').writeFileSync('versions.txt', [...pick].join('\n') + '\n');
          console.log('picked:', [...pick].join(', '));
          JSEOF
          node pick.js | tee -a "$GITHUB_STEP_SUMMARY"
          cat > dump.js <<'JSEOF'
          const dir = process.argv[2], ver = process.argv[3];
          const m = require(dir + '/node_modules/dukascopy-node').instrumentMetaData || {};
          const items = Array.isArray(m) ? m.map((v) => [v.id || v.instrument, v]) : Object.entries(m);
          const table = {}; let withDf = 0; const keys = new Set();
          for (const [k, v] of items) { if (!v || typeof v !== 'object') continue; Object.keys(v).forEach((x) => keys.add(x));
            const df = v.decimalFactor !== undefined ? v.decimalFactor : null; if (df !== null) withDf++; table[v.id || k] = { df, code: v.code || '' }; }
          require('fs').writeFileSync('table_' + ver + '.json', JSON.stringify(table));
          console.log('version', ver, '| instruments', items.length, '| with decimalFactor', withDf, '| fields:', [...keys].join(','));
          JSEOF
          for v in $(cat versions.txt); do
            mkdir -p "lib_$v" && (cd "lib_$v" && npm init -y >/dev/null && npm install "dukascopy-node@$v" >/dev/null 2>&1) || echo "install of $v failed"
            node dump.js "$PWD/lib_$v" "$v" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          done

      - name: 3) Decode the old host with that scale and compare with the library
        run: |
          cat > pickbest.py <<'PYEOF'
          import json, glob, csv
          best = None
          for f in glob.glob("table_*.json"):
              t = json.load(open(f)); n = sum(1 for v in t.values() if v.get("df"))
              print(f, "entries with scale:", n, "of", len(t))
              if best is None or n > best[1]: best = (f, n, t)
          if not best or best[1] == 0:
              print("NO library version carries a scale table"); open("best.txt", "w").write(""); raise SystemExit(0)
          open("best.txt", "w").write(best[0][6:-5])
          with open("dukascopy_scale.csv", "w", newline="") as f:
              w = csv.writer(f); w.writerow(["id", "decimalFactor", "code"])
              for k, v in sorted(best[2].items()): w.writerow([k, v.get("df") or "", v.get("code", "")])
          print("best version:", best[0][6:-5], "| scale table rows:", len(best[2]), "| with scale:", best[1])
          PYEOF
          python3 pickbest.py | tee -a "$GITHUB_STEP_SUMMARY"
          cat > fetch.py <<'PYEOF'
          import urllib.request, urllib.error, lzma, struct, time, json, os, sys
          def get(sym, y, m, d, side, tries=8):
              url = f"https://datafeed.dukascopy.com/datafeed/{sym}/{y}/{m-1:02d}/{d:02d}/{side}_candles_min_1.bi5"   # month 0-based
              for k in range(tries):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30)
                      return r.status, r.read()
                  except urllib.error.HTTPError as e:
                      if e.code in (404, 403): return e.code, b""
                  except Exception:
                      pass
                  time.sleep(3 * (k + 1))
              return None, b""
          def decode(raw, df, day_ms):
              out = []
              for i in range(len(raw) // 24):
                  t, o, c, l, h, v = struct.unpack(">IIIIIf", raw[i * 24:(i + 1) * 24])
                  out.append([day_ms + t * 1000, o / df, h / df, l / df, c / df, v])
              return out
          if __name__ == "__main__":
              import datetime
              table = json.load(open("table_" + open("best.txt").read().strip() + ".json"))
              day_ms = int(datetime.datetime(2025, 3, 4, tzinfo=datetime.timezone.utc).timestamp() * 1000)
              os.makedirs("mine", exist_ok=True)
              for id_ in ["eurusd", "usdjpy", "xauusd", "xagusd", "btcusd", "ethusd", "brentcmdusd", "cocoacmdusd", "usa500idxusd", "deuidxeur", "dollaridxusd", "bundtreur", "usdczk", "aaplususd", "abibeeur"]:
                  df = (table.get(id_) or {}).get("df")
                  if not df: print(id_, "NO SCALE in table"); continue
                  st, b = get(id_.upper(), 2025, 3, 4, "BID")
                  if st != 200 or not b: print(id_, "old host gave no file:", st); continue
                  json.dump(decode(lzma.decompress(b), df, day_ms), open(f"mine/{id_}.json", "w"))
                  print(id_, "downloaded, scale", df); time.sleep(2)
          PYEOF
          if [ -s best.txt ]; then python3 fetch.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; fi
          cat > compare.js <<'JSEOF'
          const fs = require('fs'); const ver = fs.readFileSync('best.txt', 'utf8').trim();
          const { getHistoricalRates } = require(process.cwd() + '/lib_' + ver + '/node_modules/dukascopy-node');
          (async () => {
            const lines = [];
            for (const f of fs.readdirSync('mine')) {
              const id = f.replace('.json', ''); const mine = JSON.parse(fs.readFileSync('mine/' + f));
              let lib = null, err = '';
              for (let k = 0; k < 4 && !lib; k++) {
                try { lib = await getHistoricalRates({ instrument: id, dates: { from: '2025-03-04', to: '2025-03-05' }, timeframe: 'm1', priceType: 'bid', format: 'json', volumes: true, ignoreFlats: false, retryCount: 3, failAfterRetryCount: true }); }
                catch (e) { err = ((e && e.name) || '') + ': ' + String((e && e.message) || e).slice(0, 60); await new Promise((r) => setTimeout(r, 4000 * (k + 1))); }
              }
              if (!lib) { lines.push(id + ' | LIBRARY_FAILED | ' + err); continue; }
              const map = new Map(lib.map((c) => [c.timestamp, c])); let bad = 0, first = '';
              for (const m of mine) { const c = map.get(m[0]); const ok = c && Math.abs(c.open - m[1]) < 1e-9 && Math.abs(c.high - m[2]) < 1e-9 && Math.abs(c.low - m[3]) < 1e-9 && Math.abs(c.close - m[4]) < 1e-9 && Math.abs((c.volume || 0) - m[5]) < 0.011;
                if (!ok) { bad++; if (!first) first = 'first diff @' + new Date(m[0]).toISOString().slice(11, 16) + ' mine=' + m.slice(1, 5).join('/') + ' lib=' + (c ? [c.open, c.high, c.low, c.close].join('/') : 'missing'); } }
              lines.push(id + ' | ' + (bad === 0 && mine.length === lib.length ? 'MATCH' : 'DIFF') + ' | mine ' + mine.length + ' candles, library ' + lib.length + ', different ' + bad + (first ? ' | ' + first : ''));
            }
            fs.writeFileSync('dukascopy_scale_check.txt', lines.join('\n') + '\n'); console.log(lines.join('\n'));
          })();
          JSEOF
          if [ -s best.txt ]; then node compare.js 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: 4) Upload results to the release
        if: always()
        run: |
          FILES=""; for f in dukascopy_scale.csv dukascopy_scale_check.txt; do [ -f "$f" ] && FILES="$FILES $f"; done
          if [ -n "$FILES" ]; then
            gh release view dukascopy-plan >/dev/null 2>&1 || gh release create dukascopy-plan --title dukascopy-plan --notes "Dukascopy plan results (plain files)"
            gh release upload dukascopy-plan $FILES --clobber
          fi
