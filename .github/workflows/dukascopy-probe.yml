name: dukascopy-probe

# Tiny test, no form: is Dukascopy answering GitHub's servers right now?
# Prints the runner's public IP, the raw HTTP status of one daily file, and the dukascopy-node result for 3 instruments.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dukascopy-node
        run: npm install dukascopy-node && npm ls dukascopy-node
      - name: Probe
        run: |
          echo "runner public IP: $(curl -s https://api.ipify.org)"
          echo "--- raw request (month in the URL is 0-based: 2 = March)"
          curl -s -o /dev/null -D - "https://jetta.dukascopy.com/v1/candles/minute/EUR-USD/BID/2025/2/3" | head -12
          cat > p.js <<'JSEOF'
          const { getHistoricalRates } = require('dukascopy-node');
          (async () => {
            for (const id of ['eurusd', 'xauusd', 'usa500idxusd']) {
              try {
                const d = await getHistoricalRates({ instrument: id, dates: { from: '2025-03-03', to: '2025-03-04' }, timeframe: 'm1', priceType: 'bid', format: 'json', volumes: true, retryCount: 1, failAfterRetryCount: true });
                console.log(id, 'OK', d.length, 'candles');
              } catch (e) { console.log(id, 'FAIL', (e && e.name) + ': ' + String((e && e.message) || e).slice(0, 160)); }
            }
          })();
          JSEOF
          node p.js 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
