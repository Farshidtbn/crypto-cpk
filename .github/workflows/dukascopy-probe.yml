name: dukascopy-probe

# Tiny test, no form. Runs by hand and every 6 hours.
#  1) the NEW host (jetta, behind a bot challenge): green/red history
#  2) the OLD official file host (datafeed.dukascopy.com): does it return REAL 1-minute candles? decoded and shown
#  3) a gentle burst of 40 requests to the old host to see if it starts refusing (429/403)
# The run is RED only when BOTH hosts fail.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dukascopy-node
        run: npm install dukascopy-node && npm ls dukascopy-node

      - name: Test new host (library)
        id: newhost
        continue-on-error: true
        run: |
          echo "time: $(date -u +%FT%TZ) | runner IP: $(curl -s -m 15 https://api.ipify.org)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "NEW host header: $(curl -s -m 30 -D - -o /dev/null 'https://jetta.dukascopy.com/v1/candles/minute/EUR-USD/BID/2025/3/3' | grep -i -E '^HTTP|x-amzn-waf-action' | tr '\r\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
          cat > p.js <<'JSEOF'
          const { getHistoricalRates } = require('dukascopy-node');
          (async () => {
            let ok = 0;
            for (const id of ['eurusd', 'xauusd', 'usa500idxusd']) {
              try {
                const d = await getHistoricalRates({ instrument: id, dates: { from: '2025-03-03', to: '2025-03-04' }, timeframe: 'm1', priceType: 'bid', format: 'json', volumes: true, retryCount: 1, failAfterRetryCount: true });
                console.log('library', id, 'OK', d.length, 'candles'); ok++;
              } catch (e) { console.log('library', id, 'FAIL', (e && e.name) + ': ' + String((e && e.message) || e).slice(0, 70)); }
            }
            process.exit(ok ? 0 : 1);
          })();
          JSEOF
          node p.js 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}

      - name: Test old host - decode real candles
        id: oldhost
        continue-on-error: true
        run: |
          cat > old.py <<'PYEOF'
          import urllib.request, lzma, struct, sys, datetime, time
          # month in the URL is 0-based (00 = January). Candle record = 24 bytes big-endian: seconds-from-midnight, open, close, low, high (int, price*1e5 or 1e3), volume (float32)
          def get(sym, y, m, d, side):
              url = f"https://datafeed.dukascopy.com/datafeed/{sym}/{y}/{m-1:02d}/{d:02d}/{side}_candles_min_1.bi5"
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=30)
                  return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, b""
              except Exception as e:
                  return str(e)[:60], b""
          good = 0
          for sym, y, m, d in [("EURUSD", 2025, 3, 3), ("XAUUSD", 2025, 3, 3), ("USA500IDXUSD", 2025, 3, 3), ("EURUSD", 2012, 1, 4), ("BTCUSD", 2025, 3, 3), ("BRENTCMDUSD", 2025, 3, 3)]:
              for side in ("BID", "ASK"):
                  st, b = get(sym, y, m, d, side)
                  info = ""
                  if st == 200 and b:
                      try:
                          raw = lzma.decompress(b)
                          n = len(raw) // 24
                          t, o, c, l, h, v = struct.unpack(">IIIIIf", raw[:24])
                          t2, o2, c2, l2, h2, v2 = struct.unpack(">IIIIIf", raw[(n - 1) * 24:n * 24])
                          info = f"candles={n} (multiple of 24: {len(raw) % 24 == 0}) first: {t // 3600:02d}:{t % 3600 // 60:02d} o={o} h={h} l={l} c={c} vol={v:.2f} | last: {t2 // 3600:02d}:{t2 % 3600 // 60:02d} c={c2}"
                          good += 1
                      except Exception as e:
                          info = "NOT valid candle data: " + str(e)[:50] + " | starts: " + repr(b[:40])
                  print(f"{sym} {y}-{m:02d}-{d:02d} {side}: HTTP {st}, {len(b)} bytes {info}")
                  time.sleep(0.5)
          print("old host valid files:", good)
          # gentle burst: 40 daily files, 0.3 s pause
          codes = {}
          day = datetime.date(2025, 1, 2)
          for i in range(40):
              st, b = get("EURUSD", day.year, day.month, day.day, "BID"); codes[st] = codes.get(st, 0) + 1
              day += datetime.timedelta(days=1); time.sleep(0.3)
          print("burst of 40 (status: count):", codes, "(weekends may give 404/empty, that is normal)")
          sys.exit(0 if good else 1)
          PYEOF
          python3 old.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; exit ${PIPESTATUS[0]}

      - name: Result
        run: |
          echo "new host: ${{ steps.newhost.outcome }} | old host: ${{ steps.oldhost.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.newhost.outcome }}" != "success" ] && [ "${{ steps.oldhost.outcome }}" != "success" ]; then exit 1; fi
